    <style>
        /* Force page-level scroll lock, as scroll should only happen inside the iframe if needed */
        html, body {
            overflow: hidden !important;
            height: 100% !important;
            width: 100% !important;
            margin: 0;
            padding: 0;
            background: #0f172a;
        }
        
        .portal-frame-container {
            margin-top: 80px; /* match the navbar height */
            width: 100%;
            height: calc(100vh - 80px);
            position: relative;
            background: #0f172a;
        }
        
        .portal-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Spinner */
        .portal-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: #94a3b8;
            font-family: var(--font-heading);
            font-weight: 500;
            font-size: 1rem;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(239, 68, 68, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        <a href="index.html#seva" class="mobile-nav-item" style="color: #cbd5e1;">CRG Seva</a>
        <a href="index.html#gallery" class="mobile-nav-item" style="color: #cbd5e1;">Gallery</a>

    </div>

    <!-- Portal Frame Container -->
    <main class="portal-frame-container">
        <div class="portal-loading" id="portal-loading">
            <div class="spinner"></div>
            <span>Loading Member Portal...</span>
        </div>
        <iframe 
            src="https://script.google.com/macros/s/AKfycby2CDp3DHYl35o3qw1VqxoQ1PEQQ1EA6fSVq60Le11C4uaoh3gRTHDizqiuep9TyqRe/exec" 
            class="portal-iframe" 
            id="portal-iframe"
            title="Member Portal"
            allow="geolocation; microphone; camera">
        </iframe>
    </main>

    <!-- JavaScript -->
    <script src="index.js"></script>
    <script>
        // Hide loading spinner once the iframe has loaded
        const iframe = document.getElementById('portal-iframe');
        const loading = document.getElementById('portal-loading');
        if (iframe) {
            iframe.addEventListener('load', () => {
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(() => {
                        loading.style.display = 'none';
                    }, 400);
                }
            });
        }
    </script>
